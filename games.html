<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games | Kavin Rajasekaran</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/games.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">
</head>

<body>
    <!-- Liquid Glass SVG Displacement Filter (edge-only refraction) -->
    <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none">
        <defs>
            <filter id="liquid-glass-distort" x="0%" y="0%" width="100%" height="100%"
                color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.006 0.004" numOctaves="2" seed="42" result="noise" />
                <feGaussianBlur in="noise" stdDeviation="22" result="soft-noise" />
                <feDisplacementMap in="SourceGraphic" in2="soft-noise" scale="16" xChannelSelector="R"
                    yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <div class="container">
        <header>
            <div class="logo">
                <a href="/">kavin</a>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="publications.html">Research</a></li>
                    <li><a href="#" class="active">Games</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section class="fade-in">
                <h1>Connect 4</h1>
                <p class="subtitle">Play locally or against an AI algorithm using Minimax with Alpha-Beta Pruning.</p>

                <div class="game-container">
                    <div class="controls">
                        <div class="control-group">
                            <label for="gameMode">Game Mode</label>
                            <select id="gameMode">
                                <option value="pvp">Player vs Player</option>
                                <option value="pvc" selected>Player vs Computer</option>
                                <option value="cvp">Computer vs Player</option>
                            </select>
                        </div>

                        <div class="control-group" id="difficultyGroup">
                            <label for="aiDepth">AI Difficulty (Depth)</label>
                            <select id="aiDepth">
                                <option value="1">1 (Very Easy)</option>
                                <option value="3">3 (Easy)</option>
                                <option value="5" selected>5 (Medium)</option>
                                <option value="7">7 (Hard)</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label>&nbsp;</label>
                            <button id="resetBtn">Restart Game</button>
                        </div>
                    </div>

                    <div class="turn-indicator" id="turnIndicator">Player 1's Turn (Red)</div>

                    <div class="connect4-board" id="board">
                        <!-- Board will be generated via JS -->
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>© 2025 Kavin Rajasekaran</p>
        </footer>
    </div>
    <script src="js/liquid-glass.js"></script>
    <script src="js/connect4.js"></script>
</body>

</html>
